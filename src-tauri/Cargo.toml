[package]
name = "flux-proxy"
version = "0.1.0"
description = "High-performance cross-platform MITM Web Debugging Proxy (Fiddler Classic modern alternative)"
authors = ["FluxProxy Architecture Team"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "flux_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri v2 Desktop Runtime & IPC
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime & Networking Core
tokio = { version = "1.42", features = ["full"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
http = "1.2"
bytes = "1.9"
futures-util = "0.3"

# MITM TLS & On-the-fly X.509 Certificate Generation
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
time = "0.3"

# WebSockets Interception & Upstream HTTP/1.1 + HTTP/2 Client
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "gzip",
  "brotli",
  "deflate",
] }

# Storage, Caching, Archives & Native File Dialogs
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = "0.15"
dashmap = "6.1"
moka = { version = "0.12", features = ["sync"] }
regex = "1.11"

# Encoding, Compression, Fingerprints & Diagnostics
base64 = "0.22"
flate2 = "1.1"
brotli = "9"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
